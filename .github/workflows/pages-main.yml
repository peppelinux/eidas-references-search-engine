# Deploy GitHub Pages from main branch content (as-is mirror).
# Any push to main (including report/) republishes the site root; /nightbuilds/ is preserved.
name: Pages — main (as-is)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required so peaceiris can push to gh-pages even when the repo
# default is "Read repository contents" for GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build static site from main
        run: bash scripts/build-gh-pages-site.sh main

      - name: Deploy to gh-pages (preserve nightbuilds/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
          commit_message: "deploy(main): ${{ github.sha }}"
